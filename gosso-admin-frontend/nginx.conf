server {
    listen 8083;
    server_name localhost;
    server_tokens off;

    # ── Gzip compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Include this file again in every location that defines add_header because
    # nginx otherwise discards inherited security headers for that location.
    include /etc/nginx/snippets/security-headers.conf;

    # ── Static assets with hash-based filenames (Vite output) ──
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── index.html — always revalidate ──
    location = /index.html {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Sub-path deployment under the shared development gateway ──
    location = /identity-admin {
        return 301 /identity-admin/;
    }

    location ^~ /identity-admin/ {
        rewrite ^/identity-admin/?(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ── SPA fallback ──
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
