name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gosso-admin-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gosso-admin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify shared GOSSO client main commit
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('./package.json', 'utf8'));
          const lock = JSON.parse(await readFile('./package-lock.json', 'utf8'));
          const client = lock.packages['node_modules/@gosso/client'];
          const source = manifest.dependencies?.['@gosso/client'];
          const pinnedCommit = /^git\+ssh:\/\/git@github\.com\/rushairer\/gosso-client\.git#[0-9a-f]{40}$/;
          if (source !== 'github:rushairer/gosso-client#main' || !client || !pinnedCommit.test(client.resolved || '')) {
            throw new Error('gosso-admin-frontend must track @gosso/client#main with a commit-pinned lockfile');
          }
          EOF

      - name: Quality gate
        run: npm run quality

      - name: Build subpath variant
        run: VITE_APP_BASE_PATH=/identity-admin npm run build

  seed:
    name: Seed quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seed

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: seed/go.mod
          cache-dependency-path: seed/go.sum

      - name: Verify go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  compose:
    name: Compose and preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare local signing key
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -out keys/private.pem -pkeyopt rsa_keygen_bits:2048
          chmod 600 keys/private.pem

      - name: Development preflight
        run: ./scripts/preflight.sh development

      - name: Docker Compose config validation
        run: docker compose config

      - name: Source override Compose config validation
        run: docker compose -f docker-compose.yml -f docker-compose.source.yml config

      - name: Production Compose config validation
        env:
          GOSSO_IMAGE: ghcr.io/rushairer/gosso@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GOSSO_ADMIN_FRONTEND_IMAGE: ghcr.io/rushairer/gosso-admin-frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          GOSSO_ADMIN_SEED_IMAGE: ghcr.io/rushairer/gosso-admin-seed@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          POSTGRES_IMAGE: postgres:15-alpine@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          REDIS_IMAGE: redis:7-alpine@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          NGINX_IMAGE: nginx:stable-alpine@sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
          GOSSO_SIGNING_KEY_FILE: ./keys/private.pem
          POSTGRES_PASSWORD: ci-production-password
          REDIS_PASSWORD: ci-redis-password
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password-123
          GOUNO_AUTH_ISSUER: https://sso.example.test
          GOUNO_AUTH_TOTP_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GOUNO_AUTH_VERIFY_HASH_PEPPER: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          GOUNO_CORS_ALLOWED_ORIGINS: '["https://sso.example.test"]'
          GOUNO_WEB_SERVER_TRUSTED_PROXIES: '["10.0.0.0/8"]'
          GOUNO_SMTP_HOST: smtp.example.test
          GOUNO_SMTP_USERNAME: ci
          GOUNO_SMTP_PASSWORD: ci-password
          GOUNO_SMTP_FROM: noreply@example.test
        run: docker compose -f docker-compose.production.yml config
