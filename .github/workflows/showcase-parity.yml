name: Gosso Showcase Parity

on:
  pull_request:
    branches: [main]
    paths:
      - "gosso-admin-frontend/**"
      - ".github/workflows/showcase-parity.yml"
  push:
    branches: [main]
    paths:
      - "gosso-admin-frontend/**"
      - ".github/workflows/showcase-parity.yml"
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gosso-showcase-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Gosso Showcase ↔ product parity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Gosso Admin candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout current Gouno UI main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: rushairer/gouno-ui
          ref: main
          path: upstream-gouno-ui

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            gosso-admin-frontend/package-lock.json
            upstream-gouno-ui/package-lock.json

      - name: Install Gosso Admin
        working-directory: gosso-admin-frontend
        run: npm ci

      - name: Install Gouno UI Showcase
        working-directory: upstream-gouno-ui
        run: npm ci

      - name: Install isolated Playwright runner
        working-directory: gosso-admin-frontend/e2e
        run: npm install --package-lock=false

      - name: Install Chromium
        working-directory: gosso-admin-frontend/e2e
        run: npx playwright install --with-deps chromium

      - name: Run paired structural/style/geometry parity
        working-directory: gosso-admin-frontend/e2e
        run: npx playwright test --config=showcase-parity.config.mjs

      - name: Retain paired browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gosso-showcase-parity
          path: |
            gosso-admin-frontend/playwright-report-showcase-parity
            gosso-admin-frontend/test-results/showcase-parity
          if-no-files-found: warn
          retention-days: 14
