name: Format clients state once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-clients-once.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gosso-admin-frontend/package-lock.json

      - name: Install dependencies
        working-directory: gosso-admin-frontend
        run: npm ci

      - name: Print canonical clients file
        working-directory: gosso-admin-frontend
        run: |
          echo '---BEGIN_CANONICAL_CLIENTS_TSX---'
          ./node_modules/.bin/prettier src/pages/system-management/ClientsTab.tsx
          echo '---END_CANONICAL_CLIENTS_TSX---'
