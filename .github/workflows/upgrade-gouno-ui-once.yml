name: Upgrade Gouno UI once

on:
  push:
    branches:
      - chore/gouno-ui-0.3.4

permissions:
  contents: write

concurrency:
  group: upgrade-gouno-ui-once
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: chore/gouno-ui-0.3.4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gosso-admin-frontend/package-lock.json

      - name: Install current dependencies
        working-directory: gosso-admin-frontend
        run: npm ci

      - name: Upgrade exact registry dependency
        working-directory: gosso-admin-frontend
        run: npm install --save-exact @gouno/ui@0.3.4

      - name: Remove one-shot workflow
        run: rm .github/workflows/upgrade-gouno-ui-once.yml

      - name: Commit dependency lockstep
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ui): sync @gouno/ui 0.3.4"
          git push origin HEAD:chore/gouno-ui-0.3.4
