name: Format Showcase Parity

on:
  push:
    branches:
      - ui/showcase-parity-closeout-20260913
    paths:
      - .github/workflows/format-showcase-parity.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/showcase-parity-closeout-20260913
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gosso-admin-frontend/package-lock.json
      - name: Format Home with repository Prettier
        working-directory: gosso-admin-frontend
        run: |
          npm ci
          npx prettier --write src/pages/Home.tsx
      - name: Commit canonical formatting and remove one-shot workflow
        run: |
          rm -f .github/workflows/format-showcase-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(ui): apply repository Prettier output"
          git push origin HEAD:ui/showcase-parity-closeout-20260913
