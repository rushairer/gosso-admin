name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: seed/go.mod
          cache-dependency-path: seed/go.sum
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: javascript-typescript,go
      - name: Build Go seed for CodeQL
        working-directory: seed
        run: go build ./...
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gosso-admin-frontend/package-lock.json
      - name: Audit production npm dependencies
        working-directory: gosso-admin-frontend
        run: |
          for i in 1 2 3; do
            output=$(npm audit --omit=dev --audit-level=high 2>&1) && exit_code=0 || exit_code=$?
            if [ $exit_code -eq 0 ]; then
              echo "$output"
              exit 0
            fi
            if echo "$output" | grep -Eq "503 Service Unavailable|audit endpoint returned an error|ENOTFOUND|ETIMEDOUT"; then
              echo "npm audit endpoint temporarily unavailable (attempt $i/3), waiting 5s..."
              sleep 5
            else
              echo "$output"
              exit $exit_code
            fi
          done
          echo "$output"
          if echo "$output" | grep -Eq "503 Service Unavailable|audit endpoint returned an error"; then
            echo "::error::npm audit endpoint is unavailable after 3 attempts. Refusing to report a green security result without an audit."
            exit 1
          fi
          exit $exit_code
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: seed/go.mod
          cache-dependency-path: seed/go.sum
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan Go dependencies
        working-directory: seed
        run: govulncheck ./...

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            context: gosso-admin-frontend
            dockerfile: gosso-admin-frontend/Dockerfile
          - image: seed
            context: seed
            dockerfile: seed/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build scan target
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: gosso-admin-${{ matrix.image }}:scan
      - name: Fail on high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gosso-admin-${{ matrix.image }}:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
