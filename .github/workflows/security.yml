name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: seed/go.mod
          cache-dependency-path: seed/go.sum
      - uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          languages: javascript-typescript,go
      - name: Build Go seed for CodeQL
        working-directory: seed
        run: go build ./...
      - uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gosso-admin-frontend/package-lock.json
      - name: Audit production npm dependencies
        working-directory: gosso-admin-frontend
        run: |
          for i in 1 2 3; do
            output=$(npm audit --omit=dev --audit-level=high 2>&1) && exit_code=0 || exit_code=$?
            if [ $exit_code -eq 0 ]; then
              echo "$output"
              exit 0
            fi
            if echo "$output" | grep -Eq "503 Service Unavailable|audit endpoint returned an error|ENOTFOUND|ETIMEDOUT"; then
              echo "npm audit endpoint temporarily unavailable (attempt $i/3), waiting 5s..."
              sleep 5
            else
              echo "$output"
              exit $exit_code
            fi
          done
          echo "$output"
          if echo "$output" | grep -Eq "503 Service Unavailable|audit endpoint returned an error"; then
            echo "::warning::npm audit endpoint is experiencing service issues (503). Skipping audit to avoid blocking CI."
            exit 0
          fi
          exit $exit_code
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: seed/go.mod
          cache-dependency-path: seed/go.sum
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan Go dependencies
        working-directory: seed
        run: govulncheck ./...

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            context: gosso-admin-frontend
            dockerfile: gosso-admin-frontend/Dockerfile
          - image: seed
            context: seed
            dockerfile: seed/Dockerfile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build scan target
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: gosso-admin-${{ matrix.image }}:scan
      - name: Fail on high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gosso-admin-${{ matrix.image }}:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
