name: Async state phase B

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/async-state-phase-b.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gosso-admin-frontend/package-lock.json

      - name: Install dependencies
        working-directory: gosso-admin-frontend
        run: npm ci

      - name: Apply account async state phase B
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1))

          mfa = 'gosso-admin-frontend/src/pages/account-settings/MFAPanel.tsx'
          replace_once(mfa, "import { useState } from 'react';", "import { useEffect, useState } from 'react';")
          replace_once(
              mfa,
              """    loading,\n    error,\n    startEnroll,\n""",
              """    loading,\n    error,\n    reload,\n    startEnroll,\n""",
          )
          replace_once(
              mfa,
              """  const [confirmPasswordForMFA, setConfirmPasswordForMFA] = useState('');\n  const [success, setSuccess] = useState<string | null>(null);\n""",
              """  const [confirmPasswordForMFA, setConfirmPasswordForMFA] = useState('');\n  const [success, setSuccess] = useState<string | null>(null);\n  const [hasResolvedInitialLoad, setHasResolvedInitialLoad] = useState(false);\n\n  useEffect(() => {\n    if (!loading && !error) setHasResolvedInitialLoad(true);\n  }, [error, loading]);\n""",
          )
          replace_once(
              mfa,
              "  const initialLoading = loading && !mfaStatus.enabled && !mfaEnrollment;\n",
              """  const initialLoading = loading && !hasResolvedInitialLoad;\n  const fatalLoadError = Boolean(error) && !hasResolvedInitialLoad;\n""",
          )
          replace_once(
              mfa,
              """  if (initialLoading) {\n    return (\n      <Section description={t('mfa.description')} actions={<Skeleton className=\"h-6 w-20\" />}>\n        <MfaLoadingContent label={t('mfa.loadingMfa')} />\n      </Section>\n    );\n  }\n\n  return (\n""",
              """  if (initialLoading) {\n    return (\n      <Section description={t('mfa.description')} actions={<Skeleton className=\"h-6 w-20\" />}>\n        <MfaLoadingContent label={t('mfa.loadingMfa')} />\n      </Section>\n    );\n  }\n\n  if (fatalLoadError) {\n    return (\n      <Section description={t('mfa.description')}>\n        <Alert\n          type=\"error\"\n          showIcon\n          title={error ?? ''}\n          action={\n            <Button size=\"small\" loading={loading} onClick={() => void reload().catch(() => {})}>\n              {t('common.retry')}\n            </Button>\n          }\n        />\n      </Section>\n    );\n  }\n\n  return (\n""",
          )
          replace_once(
              mfa,
              """              <Button variant=\"solid\" color=\"primary\" icon={<QrCode />} onClick={() => void handleEnrollMFA()}>\n""",
              """              <Button\n                variant=\"solid\"\n                color=\"primary\"\n                icon={<QrCode />}\n                loading={loading}\n                onClick={() => void handleEnrollMFA()}\n              >\n""",
          )

          passkeys = 'gosso-admin-frontend/src/pages/account-settings/PasskeysPanel.tsx'
          replace_once(passkeys, "import { useState } from 'react';", "import { useEffect, useState } from 'react';")
          replace_once(
              passkeys,
              "  const { passkeys, loading, error, register, remove } = usePasskeys();\n",
              "  const { passkeys, loading, error, reload, register, remove } = usePasskeys();\n",
          )
          replace_once(
              passkeys,
              """  const [newPasskeyName, setNewPasskeyName] = useState('');\n  const [pendingRemoval, setPendingRemoval] = useState<PendingRemoval | null>(null);\n\n  const initialLoading = loading && passkeys.length === 0 && !error;\n""",
              """  const [newPasskeyName, setNewPasskeyName] = useState('');\n  const [pendingRemoval, setPendingRemoval] = useState<PendingRemoval | null>(null);\n  const [hasResolvedInitialLoad, setHasResolvedInitialLoad] = useState(false);\n\n  useEffect(() => {\n    if (!loading && !error) setHasResolvedInitialLoad(true);\n  }, [error, loading]);\n\n  const initialLoading = loading && !hasResolvedInitialLoad;\n  const fatalLoadError = Boolean(error) && !hasResolvedInitialLoad;\n""",
          )
          replace_once(passkeys, "            disabled={initialLoading}\n", "            disabled={loading || fatalLoadError}\n")
          replace_once(
              passkeys,
              """            <Alert\n              type=\"error\"\n              showIcon\n              title={\n                validationError ||\n                (error === 'credential not found'\n                  ? t('passkeys.credentialNotFound')\n                  : error === 'credential does not belong to account'\n                    ? t('passkeys.credentialOwnershipMismatch')\n                    : error)\n              }\n            />\n""",
              """            <Alert\n              type=\"error\"\n              showIcon\n              title={\n                validationError ||\n                (error === 'credential not found'\n                  ? t('passkeys.credentialNotFound')\n                  : error === 'credential does not belong to account'\n                    ? t('passkeys.credentialOwnershipMismatch')\n                    : error)\n              }\n              action={\n                fatalLoadError ? (\n                  <Button size=\"small\" loading={loading} onClick={() => void reload().catch(() => {})}>\n                    {t('common.retry')}\n                  </Button>\n                ) : undefined\n              }\n            />\n""",
          )
          replace_once(
              passkeys,
              """          {initialLoading ? (\n            <PasskeysLoading label={t('passkeys.loadingPasskeys')} />\n          ) : passkeys.length === 0 ? (\n""",
              """          {initialLoading ? (\n            <PasskeysLoading label={t('passkeys.loadingPasskeys')} />\n          ) : fatalLoadError ? null : passkeys.length === 0 ? (\n""",
          )
          replace_once(
              passkeys,
              """                <Button icon={<Plus />} onClick={() => void handleOpenAddPasskey()}>\n""",
              """                <Button icon={<Plus />} disabled={loading} onClick={() => void handleOpenAddPasskey()}>\n""",
          )

          sessions = 'gosso-admin-frontend/src/pages/account-settings/SessionsPanel.tsx'
          replace_once(sessions, "import { useState } from 'react';", "import { useEffect, useState } from 'react';")
          replace_once(
              sessions,
              "  const { sessions, currentSession, loading, error, revoke } = useSessions();\n",
              "  const { sessions, currentSession, loading, error, reload, revoke } = useSessions();\n",
          )
          replace_once(
              sessions,
              """  const [success, setSuccess] = useState<string | null>(null);\n  const [pendingSessionId, setPendingSessionId] = useState<string | null>(null);\n\n  const initialLoading = loading && sessions.length === 0 && !error;\n""",
              """  const [success, setSuccess] = useState<string | null>(null);\n  const [pendingSessionId, setPendingSessionId] = useState<string | null>(null);\n  const [hasResolvedInitialLoad, setHasResolvedInitialLoad] = useState(false);\n\n  useEffect(() => {\n    if (!loading && !error) setHasResolvedInitialLoad(true);\n  }, [error, loading]);\n\n  const initialLoading = loading && !hasResolvedInitialLoad;\n  const fatalLoadError = Boolean(error) && !hasResolvedInitialLoad;\n""",
          )
          replace_once(
              sessions,
              "          {error ? <Alert type=\"error\" showIcon title={error} /> : null}\n",
              """          {error ? (\n            <Alert\n              type=\"error\"\n              showIcon\n              title={error}\n              action={\n                fatalLoadError ? (\n                  <Button size=\"small\" loading={loading} onClick={() => void reload().catch(() => {})}>\n                    {t('common.retry')}\n                  </Button>\n                ) : undefined\n              }\n            />\n          ) : null}\n""",
          )
          replace_once(
              sessions,
              """          ) : sessions.length === 0 && !error ? (\n            <Empty title={t('sessions.noSessionsTitle', { defaultValue: '暂无活跃会话' })} />\n""",
              """          ) : fatalLoadError ? null : sessions.length === 0 ? (\n            <Empty title={t('sessions.noSessionsTitle', { defaultValue: '暂无活跃会话' })} />\n""",
          )
          PY

          cat > gosso-admin-frontend/src/pages/account-settings/async-state.test.tsx <<'TEST'
          import { render, screen, waitFor } from '@testing-library/react';
          import { beforeEach, describe, expect, it, vi } from 'vitest';
          import { MessageProvider } from '@gouno/ui/core';
          import MFAPanel from './MFAPanel';
          import PasskeysPanel from './PasskeysPanel';
          import SessionsPanel from './SessionsPanel';

          const hookState = vi.hoisted(() => ({
            mfa: {} as any,
            passkeys: {} as any,
            sessions: {} as any,
          }));

          vi.mock('@gosso/client/react', () => ({
            useMfa: () => hookState.mfa,
            usePasskeys: () => hookState.passkeys,
            useSessions: () => hookState.sessions,
          }));

          vi.mock('react-i18next', () => ({
            useTranslation: () => ({ t: (key: string) => key }),
          }));

          vi.mock('../../components/auth/SudoContext', () => ({
            useSudo: () => ({
              requireSudo: vi.fn(),
              clearSudo: vi.fn(),
            }),
          }));

          vi.mock('../../auth', () => ({ logout: vi.fn() }));

          function renderPanel(panel: React.ReactNode) {
            return render(<MessageProvider>{panel}</MessageProvider>);
          }

          describe('account settings async state semantics', () => {
            beforeEach(() => {
              hookState.mfa = {
                status: { enabled: false, types: [] },
                enrollment: null,
                backupCodes: [],
                loading: true,
                error: null,
                reload: vi.fn().mockResolvedValue({ enabled: false, types: [] }),
                startEnroll: vi.fn(),
                activate: vi.fn(),
                disable: vi.fn(),
                regenerateBackupCodes: vi.fn(),
                cancelEnroll: vi.fn(),
              };
              hookState.passkeys = {
                passkeys: [],
                loading: true,
                error: null,
                reload: vi.fn().mockResolvedValue([]),
                register: vi.fn(),
                remove: vi.fn(),
              };
              hookState.sessions = {
                sessions: [],
                currentSession: null,
                loading: true,
                error: null,
                reload: vi.fn().mockResolvedValue({ list: [], current: null }),
                revoke: vi.fn(),
              };
            });

            it('does not present the SDK default MFA-disabled state when the initial status request failed', () => {
              hookState.mfa.loading = false;
              hookState.mfa.error = 'MFA API unavailable';

              renderPanel(<MFAPanel />);

              expect(screen.getByText('MFA API unavailable')).toBeInTheDocument();
              expect(screen.getByRole('button', { name: 'common.retry' })).toBeInTheDocument();
              expect(screen.queryByText('mfa.statusDisabled')).not.toBeInTheDocument();
              expect(screen.queryByText('mfa.mfaNotEnrolledDescription')).not.toBeInTheDocument();
            });

            it('keeps a known disabled MFA state visible during a later operation instead of returning to skeletons', async () => {
              hookState.mfa.loading = false;
              const view = renderPanel(<MFAPanel />);

              expect(screen.getByText('mfa.mfaNotEnrolledDescription')).toBeInTheDocument();
              await waitFor(() => expect(screen.queryByLabelText('mfa.loadingMfa')).not.toBeInTheDocument());

              hookState.mfa.loading = true;
              view.rerender(
                <MessageProvider>
                  <MFAPanel />
                </MessageProvider>
              );

              expect(screen.queryByLabelText('mfa.loadingMfa')).not.toBeInTheDocument();
              expect(screen.getByText('mfa.mfaNotEnrolledDescription')).toBeInTheDocument();
            });

            it('does not render Passkeys empty state for an unresolved fatal load error', () => {
              hookState.passkeys.loading = false;
              hookState.passkeys.error = 'Passkey API unavailable';

              renderPanel(<PasskeysPanel />);

              expect(screen.getByText('Passkey API unavailable')).toBeInTheDocument();
              expect(screen.getByRole('button', { name: 'common.retry' })).toBeInTheDocument();
              expect(screen.queryByText('passkeys.noPasskeysTitle')).not.toBeInTheDocument();
            });

            it('keeps a known-empty Passkeys state visible while a later mutation is loading', async () => {
              hookState.passkeys.loading = false;
              const view = renderPanel(<PasskeysPanel />);

              expect(screen.getByText('passkeys.noPasskeysTitle')).toBeInTheDocument();
              await waitFor(() => expect(screen.queryByLabelText('passkeys.loadingPasskeys')).not.toBeInTheDocument());

              hookState.passkeys.loading = true;
              view.rerender(
                <MessageProvider>
                  <PasskeysPanel />
                </MessageProvider>
              );

              expect(screen.queryByLabelText('passkeys.loadingPasskeys')).not.toBeInTheDocument();
              expect(screen.getByText('passkeys.noPasskeysTitle')).toBeInTheDocument();
            });

            it('does not render an empty sessions table or empty state for an initial load error', () => {
              hookState.sessions.loading = false;
              hookState.sessions.error = 'Session API unavailable';

              renderPanel(<SessionsPanel />);

              expect(screen.getByText('Session API unavailable')).toBeInTheDocument();
              expect(screen.getByRole('button', { name: 'common.retry' })).toBeInTheDocument();
              expect(screen.queryByText('sessions.noSessionsTitle')).not.toBeInTheDocument();
              expect(screen.queryByRole('table')).not.toBeInTheDocument();
            });
          });
          TEST

      - name: Format changed frontend files
        working-directory: gosso-admin-frontend
        run: npx prettier --write src/pages/account-settings/MFAPanel.tsx src/pages/account-settings/PasskeysPanel.tsx src/pages/account-settings/SessionsPanel.tsx src/pages/account-settings/async-state.test.tsx

      - name: Verify frontend quality
        working-directory: gosso-admin-frontend
        run: npm run quality

      - name: Verify identity-admin subpath build
        working-directory: gosso-admin-frontend
        run: npm run build -- --base=/identity-admin/

      - name: Commit phase B and remove one-time workflow
        run: |
          git rm .github/workflows/async-state-phase-b.yml
          git add gosso-admin-frontend/src/pages/account-settings/MFAPanel.tsx \
            gosso-admin-frontend/src/pages/account-settings/PasskeysPanel.tsx \
            gosso-admin-frontend/src/pages/account-settings/SessionsPanel.tsx \
            gosso-admin-frontend/src/pages/account-settings/async-state.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(states): separate unknown account security state"
          git push origin HEAD:main
