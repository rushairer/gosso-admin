name: Async state phase A

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/async-state-phase-a.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gosso-admin-frontend/package-lock.json

      - name: Install dependencies
        working-directory: gosso-admin-frontend
        run: npm ci

      - name: Apply async state phase A
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1))

          clients = 'gosso-admin-frontend/src/pages/system-management/ClientsTab.tsx'
          replace_once(clients, "import { useState } from 'react';", "import { useEffect, useState } from 'react';")
          replace_once(
              clients,
              """  const [copied, setCopied] = useState(false);\n  const [pendingAction, setPendingAction] = useState<PendingAction>(null);\n\n  const initialLoading = loading && clients.length === 0 && !error;\n  const fatalLoadError = Boolean(error) && clients.length === 0 && !loading;\n""",
              """  const [copied, setCopied] = useState(false);\n  const [pendingAction, setPendingAction] = useState<PendingAction>(null);\n  const [hasResolvedInitialLoad, setHasResolvedInitialLoad] = useState(false);\n\n  useEffect(() => {\n    if (!loading && !error) setHasResolvedInitialLoad(true);\n  }, [error, loading]);\n\n  const initialLoading = loading && !hasResolvedInitialLoad;\n  const fatalLoadError = Boolean(error) && !hasResolvedInitialLoad;\n""",
          )

          users = 'gosso-admin-frontend/src/pages/system-management/UsersTab.tsx'
          replace_once(users, "import { useState } from 'react';", "import { useEffect, useState } from 'react';")
          replace_once(
              users,
              """  const [consentsLoading, setConsentsLoading] = useState(false);\n  const [pendingAction, setPendingAction] = useState<PendingAction>(null);\n\n  const initialLoading = loading && accounts.length === 0;\n""",
              """  const [consentsLoading, setConsentsLoading] = useState(false);\n  const [pendingAction, setPendingAction] = useState<PendingAction>(null);\n  const [hasResolvedInitialLoad, setHasResolvedInitialLoad] = useState(false);\n\n  useEffect(() => {\n    if (!loading && !error) setHasResolvedInitialLoad(true);\n  }, [error, loading]);\n\n  const initialLoading = loading && !hasResolvedInitialLoad;\n  const fatalLoadError = Boolean(error) && !hasResolvedInitialLoad;\n""",
          )
          replace_once(users, ") : accounts.length === 0 ? (", ") : fatalLoadError ? null : accounts.length === 0 ? (")

          audit = 'gosso-admin-frontend/src/pages/system-management/AuditLogsTab.tsx'
          replace_once(audit, "import { useState } from 'react';", "import { useEffect, useState } from 'react';")
          replace_once(
              audit,
              """  const initialLoading = auditLoading && auditLogs.length === 0 && !error;\n  const fatalLoadError = Boolean(error) && auditLogs.length === 0 && !auditLoading;\n""",
              """  const [hasResolvedInitialLoad, setHasResolvedInitialLoad] = useState(false);\n\n  useEffect(() => {\n    if (!auditLoading && !error) setHasResolvedInitialLoad(true);\n  }, [auditLoading, error]);\n\n  const initialLoading = auditLoading && !hasResolvedInitialLoad;\n  const fatalLoadError = Boolean(error) && !hasResolvedInitialLoad;\n""",
          )

          site = 'gosso-admin-frontend/src/pages/system-management/SiteSettingsTab.tsx'
          replace_once(
              site,
              "  const dirty = baseline !== null && JSON.stringify(settings) !== baseline;\n",
              """  const dirty = baseline !== null && JSON.stringify(settings) !== baseline;\n  const hasLoadedSettings = baseline !== null;\n  const initialLoading = loading && !hasLoadedSettings;\n  const fatalLoadError = Boolean(error) && !hasLoadedSettings;\n""",
          )
          replace_once(site, "      {loading ? (", "      {initialLoading ? (")
          replace_once(
              site,
              '          <div className="grid gap-5 xl:grid-cols-[minmax(0,1fr)_420px]">',
              '          {fatalLoadError ? null : (\n            <div className="grid gap-5 xl:grid-cols-[minmax(0,1fr)_420px]" aria-busy={loading}>',
          )
          replace_once(
              site,
              """            </div>\n          </div>\n        </>\n      )}\n""",
              """            </div>\n          </div>\n          )}\n        </>\n      )}\n""",
          )
          replace_once(site, "disabled={!dirty || saving}", "disabled={!dirty || saving || loading}")

          clients_test = 'gosso-admin-frontend/src/pages/system-management/ClientsTab.test.tsx'
          replace_once(
              clients_test,
              """    const retry = await screen.findByRole('button', { name: /retry|重试/i });\n    await userEvent.click(retry);\n""",
              """    const retry = await screen.findByRole('button', { name: /retry|重试/i });\n    expect(screen.queryByText(/No Clients Registered|暂无已注册的客户端/i)).not.toBeInTheDocument();\n    await userEvent.click(retry);\n""",
          )

          users_test = 'gosso-admin-frontend/src/pages/system-management/UsersTab.test.tsx'
          replace_once(
              users_test,
              """  it('uses the bounded role projection without per-account requests', async () => {\n""",
              """  it('does not render an empty state when the initial account load fails', async () => {\n    vi.mocked(apiFetch).mockResolvedValueOnce({\n      ok: false,\n      json: async () => ({ message: 'Account API unavailable' }),\n    } as Response);\n\n    renderUsersTab();\n\n    expect(await screen.findByText('Account API unavailable')).toBeInTheDocument();\n    expect(screen.queryByText(/No User Accounts|暂无用户账户/i)).not.toBeInTheDocument();\n  });\n\n  it('uses the bounded role projection without per-account requests', async () => {\n""",
          )

          audit_test = 'gosso-admin-frontend/src/pages/system-management/AuditLogsTab.test.tsx'
          replace_once(
              audit_test,
              """  it('loads filters explicitly and clears them without relying on a timer', async () => {\n""",
              """  it('does not render an empty state when the initial audit load fails', async () => {\n    vi.mocked(auditService.fetchAuditLogs).mockRejectedValueOnce(new Error('Audit API unavailable'));\n\n    render(<AuditLogsTab />);\n\n    expect(await screen.findByText('Audit API unavailable')).toBeInTheDocument();\n    expect(screen.queryByText(/No Audit Logs Found|未找到审计日志/i)).not.toBeInTheDocument();\n  });\n\n  it('loads filters explicitly and clears them without relying on a timer', async () => {\n""",
          )

          site_test = 'gosso-admin-frontend/src/pages/system-management/SiteSettingsTab.test.tsx'
          replace_once(
              site_test,
              """  it('loads settings and saves the updated brand form', async () => {\n""",
              """  it('does not expose editable defaults when the initial settings load fails', async () => {\n    vi.mocked(siteSettingsService.getSiteSettings).mockRejectedValueOnce(new Error('Settings API unavailable'));\n\n    render(\n      <MemoryRouter>\n        <MessageProvider>\n          <SiteSettingsTab />\n        </MessageProvider>\n      </MemoryRouter>\n    );\n\n    expect(await screen.findByText('Settings API unavailable')).toBeInTheDocument();\n    expect(screen.queryByRole('button', { name: /save settings/i })).not.toBeInTheDocument();\n    expect(screen.queryByText('1440 × 900')).not.toBeInTheDocument();\n\n    await userEvent.click(screen.getByRole('button', { name: /retry/i }));\n    expect(await screen.findByDisplayValue('Acme Identity')).toBeInTheDocument();\n  });\n\n  it('loads settings and saves the updated brand form', async () => {\n""",
          )
          PY

      - name: Format changed frontend files
        working-directory: gosso-admin-frontend
        run: npx prettier --write src/pages/system-management/ClientsTab.tsx src/pages/system-management/UsersTab.tsx src/pages/system-management/AuditLogsTab.tsx src/pages/system-management/SiteSettingsTab.tsx src/pages/system-management/ClientsTab.test.tsx src/pages/system-management/UsersTab.test.tsx src/pages/system-management/AuditLogsTab.test.tsx src/pages/system-management/SiteSettingsTab.test.tsx

      - name: Verify frontend quality
        working-directory: gosso-admin-frontend
        run: npm run quality

      - name: Verify identity-admin subpath build
        working-directory: gosso-admin-frontend
        run: npm run build -- --base=/identity-admin/

      - name: Commit phase A and remove one-time workflow
        run: |
          git rm .github/workflows/async-state-phase-a.yml
          git add gosso-admin-frontend/src/pages/system-management/ClientsTab.tsx \
            gosso-admin-frontend/src/pages/system-management/UsersTab.tsx \
            gosso-admin-frontend/src/pages/system-management/AuditLogsTab.tsx \
            gosso-admin-frontend/src/pages/system-management/SiteSettingsTab.tsx \
            gosso-admin-frontend/src/pages/system-management/ClientsTab.test.tsx \
            gosso-admin-frontend/src/pages/system-management/UsersTab.test.tsx \
            gosso-admin-frontend/src/pages/system-management/AuditLogsTab.test.tsx \
            gosso-admin-frontend/src/pages/system-management/SiteSettingsTab.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(states): distinguish unresolved from known empty data"
          git push origin HEAD:main
