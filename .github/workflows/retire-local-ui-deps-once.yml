name: Retire local UI dependencies once

on:
  push:
    branches:
      - ui/retire-local-ui-deps

permissions:
  contents: write

concurrency:
  group: retire-local-ui-deps-once
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ui/retire-local-ui-deps

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gosso-admin-frontend/package-lock.json

      - name: Remove unused local UI helper
        run: rm gosso-admin-frontend/src/lib/utils.ts

      - name: Remove unused local UI dependencies
        working-directory: gosso-admin-frontend
        run: |
          npm ci
          npm uninstall \
            @radix-ui/react-avatar \
            @radix-ui/react-checkbox \
            @radix-ui/react-dialog \
            @radix-ui/react-dropdown-menu \
            @radix-ui/react-label \
            @radix-ui/react-popover \
            @radix-ui/react-select \
            @radix-ui/react-separator \
            @radix-ui/react-slot \
            @radix-ui/react-switch \
            @radix-ui/react-tabs \
            @radix-ui/react-tooltip \
            class-variance-authority \
            clsx \
            prop-types \
            qrcode.react \
            tailwind-merge
          npm run format
          npm run quality

      - name: Remove one-shot workflow
        run: rm .github/workflows/retire-local-ui-deps-once.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): retire local UI utility dependencies"
          git push origin HEAD:ui/retire-local-ui-deps
