name: Vendor verified Gouno UI 0.2.0

on:
  push:
    branches: [chore/gouno-ui-0.2.0]
    paths:
      - .github/workflows/vendor-gouno-ui-0.2.0.yml

permissions:
  contents: write

concurrency:
  group: vendor-gouno-ui-0.2.0
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gosso Admin migration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: chore/gouno-ui-0.2.0
          fetch-depth: 0

      - name: Checkout exact verified Gouno UI source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rushairer/gouno-ui
          ref: 3af2a5ca7d63f30fa531f605e620ba2c3380a2e8
          path: .gouno-ui
          persist-credentials: false

      - name: Setup Node.js 24 for Gouno UI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .gouno-ui/package-lock.json

      - name: Verify and pack exact Gouno UI
        working-directory: .gouno-ui
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build
          npm run showcase:build
          npm pack
          test "$(sha256sum gouno-ui-0.2.0.tgz | awk '{print $1}')" = "e0fa85594b579c971599e045855bf37b9ea25371df42e0cf15bf90dc5d86d24d"

      - name: Install verified package into Gosso vendor
        shell: bash
        run: |
          set -euo pipefail
          VENDOR="$GITHUB_WORKSPACE/gosso-admin-frontend/vendor"
          ARCHIVE="gouno-ui-0.2.0.tgz"
          rm -f "$VENDOR"/gouno-ui-*.tgz
          cp ".gouno-ui/$ARCHIVE" "$VENDOR/$ARCHIVE"

          SHA256="$(sha256sum "$VENDOR/$ARCHIVE" | awk '{print $1}')"
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$VENDOR/$ARCHIVE" | openssl base64 -A)"

          cat > "$VENDOR/gouno-ui-source.txt" <<'EOF'
          repository=https://github.com/rushairer/gouno-ui
          ref=3af2a5ca7d63f30fa531f605e620ba2c3380a2e8
          sha=3af2a5ca7d63f30fa531f605e620ba2c3380a2e8
          EOF

          node --input-type=module - "$GITHUB_WORKSPACE/gosso-admin-frontend/package.json" <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';
          const [, , path] = process.argv;
          const pkg = JSON.parse(await readFile(path, 'utf8'));
          pkg.dependencies['@gouno/ui'] = 'file:vendor/gouno-ui-0.2.0.tgz';
          await writeFile(path, `${JSON.stringify(pkg, null, 2)}\n`);
          EOF

          node --input-type=module - "$VENDOR/ui-manifest.json" "$SHA256" "$INTEGRITY" <<'EOF'
          import { writeFile } from 'node:fs/promises';
          const [, , path, sha256, integrity] = process.argv;
          const manifest = {
            name: '@gouno/ui',
            version: '0.2.0',
            archive: 'gouno-ui-0.2.0.tgz',
            sha256,
            integrity,
            source: 'rushairer/gouno-ui',
            sourceSha: '3af2a5ca7d63f30fa531f605e620ba2c3380a2e8',
          };
          await writeFile(path, `${JSON.stringify(manifest, null, 2)}\n`);
          EOF

      - name: Setup Node.js 20 for Gosso Admin
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gosso-admin-frontend/package-lock.json

      - name: Refresh lockfile and run full Gosso quality gate
        working-directory: gosso-admin-frontend
        run: |
          set -euo pipefail
          rm -rf node_modules
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';
          const lock = JSON.parse(await readFile('./package-lock.json', 'utf8'));
          if (lock.packages) delete lock.packages['node_modules/@gouno/ui'];
          await writeFile('./package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          EOF
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps
          npm ci --legacy-peer-deps
          npm run quality
          VITE_APP_BASE_PATH=/identity-admin npm run build

      - name: Commit generated vendor state
        shell: bash
        run: |
          set -euo pipefail
          git add -A gosso-admin-frontend/vendor \
                     gosso-admin-frontend/package.json \
                     gosso-admin-frontend/package-lock.json
          git diff --cached --exit-code && exit 0 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ui): vendor Gouno UI 0.2.0"
          git push origin HEAD:chore/gouno-ui-0.2.0
