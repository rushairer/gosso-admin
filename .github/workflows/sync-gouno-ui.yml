name: Verify Gouno UI Registry Dependency

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-gouno-ui.yml
  workflow_dispatch:
    inputs:
      version:
        description: Exact @gouno/ui version or npm dist-tag to verify; versions different from the certified baseline require a manual recertification PR
        required: false

permissions:
  contents: read

concurrency:
  group: verify-gouno-ui
  cancel-in-progress: false

jobs:
  update:
    name: Verify certified npm registry release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gosso Admin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gosso-admin-frontend/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Resolve published Gouno UI version
        id: ui
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_VERSION:-}" ]; then
            TARGET_VERSION="$REQUESTED_VERSION"
          else
            TARGET_VERSION="$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; const pkg = JSON.parse(await readFile('gosso-admin-frontend/package.json', 'utf8')); process.stdout.write(pkg.dependencies?.['@gouno/ui'] || '');")"
          fi
          test -n "$TARGET_VERSION"
          RESOLVED_VERSION="$(npm view "@gouno/ui@${TARGET_VERSION}" version)"
          test -n "$RESOLVED_VERSION"
          echo "version=$RESOLVED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Enforce manual-first certification baseline
        env:
          GOUNO_UI_VERSION: ${{ steps.ui.outputs.version }}
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          const ledger = JSON.parse(await readFile('docs/ui/showcase-parity-certifications.json', 'utf8'));
          const entry = ledger.certifications?.find((item) => item.id === 'gosso-admin-frozen');
          if (!entry || entry.status !== 'verified') {
            throw new Error('Registry verification is blocked while Gosso Showcase parity is not verified. Use a manual recertification PR.');
          }
          if (entry.gounoUiPackageVersion !== process.env.GOUNO_UI_VERSION) {
            throw new Error(
              `Requested @gouno/ui ${process.env.GOUNO_UI_VERSION} differs from certified ${entry.gounoUiPackageVersion}. Create a manual recertification PR; automated main updates are intentionally blocked.`,
            );
          }
          EOF

      - name: Install certified registry dependency
        working-directory: gosso-admin-frontend
        run: npm ci --legacy-peer-deps

      - name: Verify published package contract
        working-directory: gosso-admin-frontend
        env:
          GOUNO_UI_VERSION: ${{ steps.ui.outputs.version }}
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('./package.json', 'utf8'));
          const lock = JSON.parse(await readFile('./package-lock.json', 'utf8'));
          const installed = JSON.parse(await readFile('./node_modules/@gouno/ui/package.json', 'utf8'));
          const ui = lock.packages?.['node_modules/@gouno/ui'];
          const source = manifest.dependencies?.['@gouno/ui'];
          const exactVersion = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/;
          if (!exactVersion.test(source || '') || source !== process.env.GOUNO_UI_VERSION) {
            throw new Error('gosso-admin-frontend must pin the requested exact @gouno/ui registry version');
          }
          if (!ui || ui.version !== source || !ui.resolved?.startsWith('https://registry.npmjs.org/@gouno/ui/-/ui-') || !ui.integrity) {
            throw new Error('gosso-admin-frontend lockfile must resolve @gouno/ui from npm with integrity');
          }
          if (installed.version !== source) {
            throw new Error('installed @gouno/ui version does not match the pinned registry version');
          }
          const core = await import('@gouno/ui/core');
          const theme = await import('@gouno/ui/theme');
          const gouno = await import('@gouno/ui/gouno');
          const surfaces = [
            ['@gouno/ui/core', core, ['Button', 'IconButton', 'Tabs', 'NavigationProvider', 'TooltipProvider', 'Skeleton']],
            ['@gouno/ui/theme', theme, ['ThemeProvider']],
            ['@gouno/ui/gouno', gouno, ['AppShell', 'PageContainer', 'PageHeader', 'NavigationGroup', 'PageSkeleton']],
          ];
          for (const [entrypoint, surface, names] of surfaces) {
            for (const name of names) {
              if (!surface[name]) throw new Error(`${entrypoint} is missing canonical export ${name}`);
            }
          }
          EOF

      - name: Run Gosso Admin quality gates
        working-directory: gosso-admin-frontend
        run: |
          npm run quality
          VITE_APP_BASE_PATH=/identity-admin npm run build

      - name: Build Gosso Admin frontend container
        run: docker build -f gosso-admin-frontend/Dockerfile gosso-admin-frontend
