name: Sync Gouno UI
# Editing this workflow intentionally triggers the verified upstream resync path.
# Last explicit upstream sync target: gouno-ui main@0ba9fabda8e61f3a278b3fb5f37b8f671c167abb (consumer retry after format gate fix).

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-gouno-ui.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Gouno UI branch, tag, or commit
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: sync-gouno-ui
  cancel-in-progress: false

jobs:
  sync:
    name: Build, verify, and vendor Gouno UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gosso Admin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Checkout Gouno UI
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rushairer/gouno-ui
          ref: ${{ inputs.ref || 'main' }}
          path: .gouno-ui
          persist-credentials: false

      - name: Setup Node.js 24 for Gouno UI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .gouno-ui/package-lock.json

      - name: Build Gouno UI package
        working-directory: .gouno-ui
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Pack current Gouno UI
        shell: bash
        run: |
          set -euo pipefail
          VENDOR="$GITHUB_WORKSPACE/gosso-admin-frontend/vendor"
          FRONTEND_PACKAGE="$GITHUB_WORKSPACE/gosso-admin-frontend/package.json"
          PACKAGE_VERSION="$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; const pkg = JSON.parse(await readFile('.gouno-ui/package.json', 'utf8')); process.stdout.write(pkg.version);")"
          ARCHIVE="gouno-ui-${PACKAGE_VERSION}.tgz"

          rm -f "$VENDOR"/gouno-ui-*.tgz
          PACK_JSON="$(cd .gouno-ui && npm pack --json)"
          PACK_FILE="$(printf '%s' "$PACK_JSON" | node --input-type=module -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => { const value = JSON.parse(s); if (!value[0]?.filename) process.exit(1); process.stdout.write(value[0].filename); });')"
          cp ".gouno-ui/$PACK_FILE" "$VENDOR/$ARCHIVE"

          GOUNO_UI_SHA="$(git -C .gouno-ui rev-parse HEAD)"
          SHA256="$(sha256sum "$VENDOR/$ARCHIVE" | awk '{print $1}')"
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$VENDOR/$ARCHIVE" | openssl base64 -A)"

          cat > "$VENDOR/gouno-ui-source.txt" <<EOF
          repository=https://github.com/rushairer/gouno-ui
          ref=${{ inputs.ref || 'main' }}
          sha=$GOUNO_UI_SHA
          EOF

          node --input-type=module - "$FRONTEND_PACKAGE" "$ARCHIVE" <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';
          const [, , path, archive] = process.argv;
          const pkg = JSON.parse(await readFile(path, 'utf8'));
          pkg.dependencies['@gouno/ui'] = `file:vendor/${archive}`;
          await writeFile(path, `${JSON.stringify(pkg, null, 2)}\n`);
          EOF

          node --input-type=module - "$VENDOR/ui-manifest.json" "$PACKAGE_VERSION" "$ARCHIVE" "$SHA256" "$INTEGRITY" "$GOUNO_UI_SHA" <<'EOF'
          import { writeFile } from 'node:fs/promises';
          const [, , path, version, archive, sha256, integrity, sourceSha] = process.argv;
          const manifest = {
            name: '@gouno/ui',
            version,
            archive,
            sha256,
            integrity,
            source: 'rushairer/gouno-ui',
            sourceSha,
          };
          await writeFile(path, `${JSON.stringify(manifest, null, 2)}\n`);
          EOF

      - name: Setup Node.js 20 for Gosso Admin
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gosso-admin-frontend/package-lock.json

      - name: Refresh lockfile and verify Gosso Admin
        working-directory: gosso-admin-frontend
        run: |
          set -euo pipefail
          rm -rf node_modules
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';
          const lock = JSON.parse(await readFile('./package-lock.json', 'utf8'));
          if (lock.packages) delete lock.packages['node_modules/@gouno/ui'];
          await writeFile('./package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          EOF
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps
          npm ci --legacy-peer-deps
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';

          const pkg = JSON.parse(await readFile('./package.json', 'utf8'));
          const manifest = JSON.parse(await readFile('./vendor/ui-manifest.json', 'utf8'));
          const source = await readFile('./vendor/gouno-ui-source.txt', 'utf8');
          const archivePath = `./vendor/${manifest.archive}`;
          const archive = await readFile(archivePath);
          const installed = JSON.parse(await readFile('./node_modules/@gouno/ui/package.json', 'utf8'));
          const sha256 = createHash('sha256').update(archive).digest('hex');
          const integrity = `sha512-${createHash('sha512').update(archive).digest('base64')}`;

          if (pkg.dependencies?.['@gouno/ui'] !== `file:vendor/${manifest.archive}`) {
            throw new Error('package.json Gouno UI dependency does not match vendor manifest archive');
          }
          if (installed.version !== manifest.version) {
            throw new Error('installed Gouno UI version does not match vendor manifest');
          }
          if (manifest.sha256 !== sha256 || manifest.integrity !== integrity) {
            throw new Error('vendored Gouno UI archive digest does not match vendor manifest');
          }
          if (!source.includes(`sha=${manifest.sourceSha}`)) {
            throw new Error('Gouno UI provenance source SHA does not match vendor manifest');
          }

          const core = await import('@gouno/ui/core');
          const theme = await import('@gouno/ui/theme');
          const gouno = await import('@gouno/ui/gouno');
          const surfaces = [
            ['@gouno/ui/core', core, ['Button', 'IconButton', 'Tabs', 'NavigationProvider', 'TooltipProvider', 'Skeleton']],
            ['@gouno/ui/theme', theme, ['ThemeProvider']],
            ['@gouno/ui/gouno', gouno, ['AppShell', 'PageContainer', 'PageHeader', 'NavigationGroup']],
          ];
          for (const [entrypoint, surface, names] of surfaces) {
            for (const name of names) {
              if (!surface[name]) throw new Error(`vendored ${entrypoint} is missing canonical export ${name}`);
            }
          }
          EOF
          npm run quality
          VITE_APP_BASE_PATH=/identity-admin npm run build

      - name: Commit synchronized package
        shell: bash
        run: |
          set -euo pipefail
          git add -A gosso-admin-frontend/vendor \
                     gosso-admin-frontend/package.json \
                     gosso-admin-frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Gouno UI package is already synchronized."
            exit 0
          fi
          GOUNO_UI_VERSION="$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; const pkg = JSON.parse(await readFile('gosso-admin-frontend/package.json', 'utf8')); process.stdout.write(pkg.dependencies['@gouno/ui'].match(/gouno-ui-(.+)\.tgz$/)?.[1] || 'unknown');")"
          GOUNO_UI_SHA="$(git -C .gouno-ui rev-parse --short=12 HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ui): sync gouno ui ${GOUNO_UI_VERSION} ${GOUNO_UI_SHA}"
          git push origin HEAD:main
