name: Sync Gouno UI
# Temporary branch validation revision 2.

on:
  push:
    branches: [main, ui/gouno-production-alignment-20260909]
    paths:
      - .github/workflows/sync-gouno-ui.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Gouno UI branch, tag, or commit
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: sync-gouno-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Build, verify, and vendor Gouno UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gosso Admin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Checkout Gouno UI
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rushairer/gouno-ui
          ref: ${{ inputs.ref || 'main' }}
          path: .gouno-ui
          persist-credentials: false

      - name: Setup Node.js 24 for Gouno UI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .gouno-ui/package-lock.json

      - name: Build Gouno UI package
        working-directory: .gouno-ui
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Pack current Gouno UI
        shell: bash
        run: |
          set -euo pipefail
          rm -f gosso-admin-frontend/vendor/gouno-ui-*.tgz
          (
            cd .gouno-ui
            npm pack --pack-destination "$GITHUB_WORKSPACE/gosso-admin-frontend/vendor"
          )
          GOUNO_UI_SHA="$(git -C .gouno-ui rev-parse HEAD)"
          {
            echo "repository=https://github.com/rushairer/gouno-ui"
            echo "ref=${{ inputs.ref || 'main' }}"
            echo "sha=${GOUNO_UI_SHA}"
          } > gosso-admin-frontend/vendor/gouno-ui-source.txt

      - name: Setup Node.js 20 for Gosso Admin
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gosso-admin-frontend/package-lock.json

      - name: Refresh lockfile and verify Gosso Admin
        working-directory: gosso-admin-frontend
        run: |
          rm -rf node_modules
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';
          const lock = JSON.parse(await readFile('./package-lock.json', 'utf8'));
          if (lock.packages) {
            delete lock.packages['node_modules/@gouno/ui'];
          }
          await writeFile('./package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          EOF
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps
          npm ci --legacy-peer-deps
          npm run format
          npm run quality
          VITE_APP_BASE_PATH=/identity-admin npm run build

      - name: Commit synchronized package
        shell: bash
        run: |
          set -euo pipefail
          git add gosso-admin-frontend/src \
                  gosso-admin-frontend/vendor/gouno-ui-0.1.0.tgz \
                  gosso-admin-frontend/vendor/gouno-ui-source.txt \
                  gosso-admin-frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Gouno UI package is already synchronized."
            exit 0
          fi
          GOUNO_UI_SHA="$(git -C .gouno-ui rev-parse --short=12 HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ui): format and sync gouno ui ${GOUNO_UI_SHA}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
