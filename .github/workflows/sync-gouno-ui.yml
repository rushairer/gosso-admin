name: Sync Gouno UI

on:
  push:
    branches: [main, ui/gouno-production-alignment-20260909]
    paths:
      - .github/workflows/sync-gouno-ui.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Gouno UI branch, tag, or commit
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: sync-gouno-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Build, verify, and vendor Gouno UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gosso Admin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Checkout Gouno UI
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rushairer/gouno-ui
          ref: ${{ inputs.ref || 'main' }}
          path: .gouno-ui
          persist-credentials: false

      - name: Setup Node.js 24 for Gouno UI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .gouno-ui/package-lock.json

      - name: Build Gouno UI package
        working-directory: .gouno-ui
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Pack current Gouno UI
        shell: bash
        run: |
          set -euo pipefail
          VENDOR="$GITHUB_WORKSPACE/gosso-admin-frontend/vendor"
          rm -f "$VENDOR"/gouno-ui-*.tgz
          PACK_JSON="$(cd .gouno-ui && npm pack --json)"
          PACK_FILE="$(printf '%s' "$PACK_JSON" | node --input-type=module -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => { const value = JSON.parse(s); if (!value[0]?.filename) process.exit(1); process.stdout.write(value[0].filename); });')"
          cp ".gouno-ui/$PACK_FILE" "$VENDOR/gouno-ui-0.1.0.tgz"

          GOUNO_UI_SHA="$(git -C .gouno-ui rev-parse HEAD)"
          SHA256="$(sha256sum "$VENDOR/gouno-ui-0.1.0.tgz" | awk '{print $1}')"
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$VENDOR/gouno-ui-0.1.0.tgz" | openssl base64 -A)"

          cat > "$VENDOR/gouno-ui-source.txt" <<EOF
          repository=https://github.com/rushairer/gouno-ui
          ref=${{ inputs.ref || 'main' }}
          sha=$GOUNO_UI_SHA
          EOF

          node --input-type=module - "$VENDOR/ui-manifest.json" "$SHA256" "$INTEGRITY" "$GOUNO_UI_SHA" <<'EOF'
          import { writeFile } from 'node:fs/promises';
          const [, , path, sha256, integrity, sourceSha] = process.argv;
          const manifest = {
            name: '@gouno/ui',
            version: '0.1.0',
            archive: 'gouno-ui-0.1.0.tgz',
            sha256,
            integrity,
            source: 'rushairer/gouno-ui',
            sourceSha,
          };
          await writeFile(path, `${JSON.stringify(manifest, null, 2)}\n`);
          EOF

      - name: Setup Node.js 20 for Gosso Admin
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gosso-admin-frontend/package-lock.json

      - name: Refresh lockfile and verify Gosso Admin
        working-directory: gosso-admin-frontend
        run: |
          set -euo pipefail
          rm -rf node_modules
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';
          const lock = JSON.parse(await readFile('./package-lock.json', 'utf8'));
          if (lock.packages) delete lock.packages['node_modules/@gouno/ui'];
          await writeFile('./package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          EOF
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps
          npm ci --legacy-peer-deps
          node --input-type=module <<'EOF'
          const ui = await import('@gouno/ui');
          for (const name of ['AppShell', 'PageContainer']) {
            if (!ui[name]) throw new Error(`vendored @gouno/ui is missing canonical export ${name}`);
          }
          EOF
          npm run quality
          VITE_APP_BASE_PATH=/identity-admin npm run build

      - name: Commit synchronized package
        shell: bash
        run: |
          set -euo pipefail
          git add gosso-admin-frontend/vendor/gouno-ui-0.1.0.tgz \
                  gosso-admin-frontend/vendor/gouno-ui-source.txt \
                  gosso-admin-frontend/vendor/ui-manifest.json \
                  gosso-admin-frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Gouno UI package is already synchronized."
            exit 0
          fi
          GOUNO_UI_SHA="$(git -C .gouno-ui rev-parse --short=12 HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ui): sync gouno ui ${GOUNO_UI_SHA}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
