name: Bug report
description: Report a reproducible defect without secrets or identity data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities must be reported privately according to SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or image digest
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options: [Docker Compose, Helm or Kubernetes, Source development, Other]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, tokens, private keys, and personal data.
